name: Deploy migrations

# Applies pending migrations to the DEVELOPMENT Supabase project when they
# reach main. Production migrations are applied by hand on each release.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  # Manual run, for the first deploy or to retry a failed one.
  workflow_dispatch:

# Never run two pushes against the same database at once.
concurrency:
  group: deploy-migrations-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Apply migrations to development
    runs-on: ubuntu-latest
    # A manual run from another branch must not push its migrations.
    if: github.ref == 'refs/heads/main'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Keep in sync with the `supabase` dev dependency in package.json.
          version: 2.120.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      # The seed is simulated data for local development: it is not pushed.
      - run: supabase db push --yes
