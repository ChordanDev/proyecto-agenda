name: Deploy migrations

# Applies pending migrations to the DEVELOPMENT Supabase project when they
# reach main. Production migrations are applied by hand on each release.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  # Manual run, for the first deploy or to retry a failed one.
  workflow_dispatch:

# Never run two pushes against the same database at once.
concurrency:
  group: deploy-migrations-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Apply migrations to development
    runs-on: [self-hosted, linux]
    # A manual run from another branch must not push its migrations.
    if: github.ref == 'refs/heads/main'
    env:
      # The Session pooler connection string of the development project
      # (dashboard > Connect > Session pooler), with the database password.
      # GitHub runners have no IPv6, and the direct database address is IPv6
      # only, so db push goes through the IPv4 pooler instead of `supabase link`.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Keep in sync with the `supabase` dev dependency in package.json.
          version: 2.120.0
      # The seed is simulated data for local development: it is not pushed.
      - run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
