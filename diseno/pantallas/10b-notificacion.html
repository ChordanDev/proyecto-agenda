<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Notificación de recordatorio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&amp;family=Oswald:wght@500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans','Segoe UI',system-ui,sans-serif;color:#222222}
a{color:#1B3550}a:hover{color:#10233A}
</style>
</helmet>
<!-- The recordatorio as the phone shows it (#161, #163): one aviso the day before at 20 h, hora de la asociación.
     Title: one evento "Mañana: <título>"; several "Mañana: <primero> y N eventos más" (actividades regulares do not count).
     Second line: the iglesia and the hora for one evento; "Tocá para verlos en el calendario" for several. Tapping opens the calendario on that day.
     The lock screen around it is only context: the phone draws it. -->
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(160deg, #3B4C63, #1C2533); color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 70px 14px 0; font-family: 'Noto Sans', 'Segoe UI', system-ui, sans-serif">
  <span style="font-size: 20px; opacity: 0.85">viernes 23 de octubre</span>
  <span style="font-size: 84px; font-weight: 300; line-height: 1">20:00</span>
  <span style="height: 30px"></span>
  <sc-if value="{{ uno }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; gap: 12px; align-items: flex-start; width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 22px; background: rgba(245,245,247,0.92); color: #111111">
      <span style="width: 38px; height: 38px; border-radius: 9px; background: #1B3550; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="display: flex; justify-content: space-between; font-size: 14px; color: #555555"><strong style="color: #111111">Agenda de iglesia</strong>ahora</span>
        <span style="font-size: 17px; font-weight: 700">Mañana: Congreso de Jóvenes</span>
        <span style="font-size: 15px; color: #333333">Iglesia Central · 09:00</span>
      </span>
    </div>
  </sc-if>
  <sc-if value="{{ varios }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; gap: 12px; align-items: flex-start; width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 22px; background: rgba(245,245,247,0.92); color: #111111">
      <span style="width: 38px; height: 38px; border-radius: 9px; background: #1B3550; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="display: flex; justify-content: space-between; font-size: 14px; color: #555555"><strong style="color: #111111">Agenda de iglesia</strong>ahora</span>
        <span style="font-size: 17px; font-weight: 700">Mañana: Culto joven y 2 eventos más</span>
        <span style="font-size: 15px; color: #333333">Tocá para verlos en el calendario</span>
      </span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const cual = st.cual || 'ambos';
    return { uno: cual !== 'varios', varios: cual !== 'uno' };
  }
}
</script>
</body>
</html>
