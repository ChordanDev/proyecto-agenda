name: CI

# The four checks below are required to merge a pull request into main.
# Their names are referenced by the branch protection rule: do not rename them.
# They run on every pull request, whatever its base, so stacked pull requests
# get checked before their parent is merged. Draft pull requests are skipped until they are marked ready for review.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  types:
    name: Types
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The Edge Functions run in Deno and tsc leaves them out: Deno checks
      # them, and with them the domain they import from src.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check the Edge Functions
        run: |
          for function in supabase/functions/*/; do
            (cd "$function" && deno check index.ts)
          done
      # Their own unit tests (*_test.ts). A test that needs a local Supabase
      # is skipped here: it runs only with SUPABASE_URL set.
      - name: Test the Edge Functions
        run: |
          for function in supabase/functions/*/; do
            if compgen -G "${function}*_test.ts" > /dev/null; then
              (cd "$function" && deno test --allow-env)
            fi
          done

  style:
    name: Style
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ESLint and Prettier.
      - run: npm run lint

  domain-tests:
    name: Domain tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --ci

  permission-tests:
    name: Permission tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only to run the script that generates a test: it needs no dependency.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          # Keep in sync with the `supabase` dev dependency in package.json.
          version: 2.120.0
      # Starts an empty local database and applies every migration from scratch.
      - run: supabase db start
      - run: supabase test db
      - name: Check that the generated types match the schema
        run: |
          supabase gen types typescript --local > src/shared/database.types.ts
          if ! git diff --exit-code src/shared/database.types.ts; then
            echo "::error file=src/shared/database.types.ts::The generated types are out of date. Run 'npm run db:types' and commit the result."
            exit 1
          fi
      - name: Check that the generated cargos rule test matches its table of cases
        run: |
          # A deleted file would be regenerated untracked and slip past git diff.
          if ! git ls-files --error-unmatch supabase/tests/cargos_regla.test.sql > /dev/null; then
            echo "::error file=supabase/tests/cargos_regla.test.sql::The generated test is missing. Run 'npm run db:casos-cargos' and commit the result."
            exit 1
          fi
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/generar-casos-cargos.ts
          if ! git diff --exit-code supabase/tests/cargos_regla.test.sql; then
            echo "::error file=supabase/tests/cargos_regla.test.sql::The generated test is out of date with src/features/sesion/dominio/cargosAbarcanDuenio.casos.json. Run 'npm run db:casos-cargos' and commit the result."
            exit 1
          fi
