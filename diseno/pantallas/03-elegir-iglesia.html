<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = (this.state && this.state.sel) || 'central';
    const data = [
      { id: 'central', nombre: 'Iglesia Central', distrito: 'Distrito Norte', localidad: 'Córdoba' },
      { id: 'norte', nombre: 'Iglesia Barrio Norte', distrito: 'Distrito Norte', localidad: 'Córdoba' },
      { id: 'rosas', nombre: 'Iglesia Las Rosas', distrito: 'Distrito Norte', localidad: 'Villa Allende' },
      { id: 'jardin', nombre: 'Iglesia Jardín', distrito: 'Distrito Sur', localidad: 'Alta Gracia' }
    ];
    return {
      iglesias: data.map((ig) => ({
        ...ig,
        sel: ig.id === sel,
        notSel: ig.id !== sel,
        checked: ig.id === sel ? 'true' : 'false',
        pick: () => this.setState({ sel: ig.id })
      }))
    };
  }
}
</script>
